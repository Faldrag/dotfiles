$font = JetBrainsMono Nerd Font



background {
    monitor =
    color = rgba(0, 0, 0, 1)
}

label {
    monitor =
    text = $TIME
    color = rgba(255, 255, 255, 0.85)
    font_size = 90
    font_family = $font
    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date '+%A, %d %B')"
    color = rgba(255, 255, 255, 0.35)
    font_size = 18
    font_family = $font
    position = 0, -20
halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 55
    outline_thickness = 2
    rounding = 30
    inner_color = rgba(255, 255, 255, 0.05)
    outer_color = rgba(255, 255, 255, 0.15)
    check_color = rgba(255, 255, 255, 0.8)
    fail_color = rgba(255, 80, 80, 0.8)
    font_color = rgba(255, 255, 255, 0.9)
    fade_on_empty = true
    placeholder_text =
    fail_text = <i>$PAMFAIL</i>
    dots_size = 0.25
    dots_spacing = 0.4
    dots_center = true
    position = 0, -140
    halign = center
    valign = center
}
